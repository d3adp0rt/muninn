name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Rust
        run: cargo ndk -t arm64-v8a -o android/app/src/main/jniLibs build --release

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::error::RELEASE_KEYSTORE_B64 is not configured; refusing to publish a release signed with a debug key."
            exit 1
          fi

      - name: Version
        run: |
          echo "MUNINN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "MUNINN_VERSION_CODE=${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename + checksum
        run: |
          set -euo pipefail
          apk="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          test -n "$apk"
          out="muninn-${GITHUB_REF_NAME}-arm64-v8a.apk"
          cp "$apk" "$out"
          sha256sum "$out" > "$out.sha256"

      - name: Notes
        run: |
          set -euo pipefail
          {
            echo "## Muninn ${GITHUB_REF_NAME}"
            echo
            echo "Android 8.0+ · arm64-v8a · local-first, no telemetry."
            echo
            echo "### Changes"
            git log --pretty=format:'- %s (%h)' \
              "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"..HEAD || true
            echo
            echo
            echo "### Verify"
            echo
            echo '```'
            echo "sha256sum -c muninn-${GITHUB_REF_NAME}-arm64-v8a.apk.sha256"
            echo '```'
            echo
            echo "Signing certificate SHA-256: \`163dbdc4aea845f0e0fa25dca746cc6ff24af256f2500097e2901dd8ee17479e\`"
          } > notes.md

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            muninn-*.apk
            muninn-*.apk.sha256
          body_path: notes.md
          generate_release_notes: true
